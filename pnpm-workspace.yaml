packages:
  - apps/*
  - packages/*
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry/cli': true
  '@swc/core': true
  argon2: true
  cpu-features: false
  esbuild: true
  ffmpeg-static: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true
# React exato que o React Native 0.88 (Expo SDK 58) espera: o renderer confere a versão e
# o app fecha se divergir. Uma só versão no monorepo evita duas cópias do React no bundle.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
