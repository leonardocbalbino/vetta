# Vetta (homologação) no nginx do host. Os serviços escutam só em 127.0.0.1.
# O HTTPS é adicionado pelo certbot (`certbot --nginx`) quando o DNS apontar para a VPS.

map $http_upgrade $vetta_connection_upgrade {
  default upgrade;
  '' close;
}

# Site: landing, páginas de venda e central de ajuda
server {
  listen 80;
  listen [::]:80;
  server_name vettafit.com.br www.vettafit.com.br;
  location / {
    proxy_pass http://127.0.0.1:8613;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Web do personal e do aluno (também atende os domínios próprios via CNAME)
server {
  listen 80;
  listen [::]:80;
  server_name app.vettafit.com.br;
  location / {
    proxy_pass http://127.0.0.1:8611;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Painel admin
server {
  listen 80;
  listen [::]:80;
  server_name admin.vettafit.com.br;
  location / {
    proxy_pass http://127.0.0.1:8612;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# API (REST + Socket.IO)
server {
  listen 80;
  listen [::]:80;
  server_name api.vettafit.com.br;
  client_max_body_size 2m;
  location / {
    proxy_pass http://127.0.0.1:8610;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $vetta_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

# Mídia: URLs pré-assinadas do storage S3 (o Host precisa chegar intacto para a assinatura).
server {
  listen 80;
  listen [::]:80;
  server_name cdn.vettafit.com.br;
  client_max_body_size 2100m;
  proxy_request_buffering off;
  location / {
    proxy_pass http://127.0.0.1:8614;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
